---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: palworld
spec:
  replicas: 1
  serviceName: palworld
  minReadySeconds: 10
  selector:
    matchLabels:
      app: palworld
  template:
    metadata:
      labels:
        app: palworld
    spec:
      tolerations:
      - effect: NoSchedule
        key: dedicated/gaming
        operator: Equal
        value: 'true'
      nodeSelector:
        palworld: allow
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: palworld
        image: docker.io/thijsvanloef/palworld-server-docker:v2.7.3
        ports:
        - name: palworld
          protocol: UDP
          containerPort: 8211
        - name: steamquery
          protocol: UDP
          containerPort: 27015
        - name: rcon
          containerPort: 25575
        - name: rest
          containerPort: 8212
        securityContext:
          capabilities:
            add:
            - NET_RAW
        env:
        - name: LOG_FORMAT_TYPE
          value: json
        - name: PORT
          value: '8211'
        - name: PLAYERS
          value: '8'
        - name: ENABLE_PERF_THREADING_ARGS
          value: 'true'
        - name: WORKER_THREADS_SERVER
          value: '4'
        - name: PALWORLD_ALLOW_NEGATIVE_DELTA_TIME
          value: 'true'
        - name: COMMUNITY
          valueFrom:
            configMapKeyRef:
              name: palworld-settings
              key: use_community
        - name: SERVER_NAME
          valueFrom:
            configMapKeyRef:
              name: palworld-settings
              key: server_name
        - name: SERVER_DESCRIPTION
          valueFrom:
            configMapKeyRef:
              name: palworld-settings
              key: server_description
        - name: SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: palworld-passwords
              key: server_password
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: palworld-passwords
              key: admin_password
        - name: UPDATE_ON_BOOT
          valueFrom:
            configMapKeyRef:
              name: palworld-settings
              key: autoupdate
        - name: AUTO_UPDATE_ENABLED
          valueFrom:
            configMapKeyRef:
              name: palworld-settings
              key: autoupdate
        - name: PAL_STOMACH_DECREASE_RATE
          valueFrom:
            configMapKeyRef:
              name: palworld-settings
              key: hunger_rate
        - name: SUPPLY_DROP_SPAN
          valueFrom:
            configMapKeyRef:
              name: palworld-settings
              key: supply_drop_minutes
        - name: ENABLE_GAMEDATA_API
          value: 'true'
        - name: RCON_ENABLED
          value: 'true'
        - name: RCON_PORT
          value: '25575'
        - name: REST_API_ENABLED
          value: 'true'
        - name: REST_API_PORT
          value: '8212'
        - name: DISABLE_GENERATE_ENGINE
          value: 'false'
        - name: DISABLE_GENERATE_SETTINGS
          value: 'false'
        - name: AUTO_REBOOT_ENABLED
          value: 'false'
        - name: QUERY_PORT
          value: '27015'
        - name: CROSSPLAY_PLATFORMS
          value: (Steam,Xbox,PS5,Mac)
        - name: BACKUP_ENABLED
          value: 'true'
        - name: USE_BACKUP_SAVE_DATA
          value: 'true'
        - name: BACKUP_CRON_EXPRESSION
          # every midnight
          # value: 0 0 * * *
          # every hour
          value: 0 * * * *
        - name: DELETE_OLD_BACKUPS
          value: 'true'
        - name: OLD_BACKUP_DAYS
          value: '30'
        - name: AUTO_PAUSE_ENABLED
          value: 'false'
        # game customization below
        - name: ENEMY_DROP_ITEM_RATE
          valueFrom:
            configMapKeyRef:
              name: palworld-settings
              key: enemy_drop_item_rate
        - name: PAL_CAPTURE_RATE
          valueFrom:
            configMapKeyRef:
              name: palworld-settings
              key: pal_capture_rate
        - name: PAL_SPAWN_NUM_RATE
          valueFrom:
            configMapKeyRef:
              name: palworld-settings
              key: pal_spawn_rate
        - name: ENABLE_PLAYER_TO_PLAYER_DAMAGE
          valueFrom:
            configMapKeyRef:
              name: palworld-settings
              key: friendly_fire
        - name: ENABLE_FRIENDLY_FIRE
          valueFrom:
            configMapKeyRef:
              name: palworld-settings
              key: friendly_fire
        - name: BASE_CAMP_WORKER_MAX_NUM
          valueFrom:
            configMapKeyRef:
              name: palworld-settings
              key: max_base_workers
        - name: BASE_CAMP_MAX_NUM_IN_GUILD
          valueFrom:
            configMapKeyRef:
              name: palworld-settings
              key: max_bases
        - name: EXP_RATE
          valueFrom:
            configMapKeyRef:
              name: palworld-settings
              key: exp_rate
        - name: DEATH_PENALTY
          valueFrom:
            configMapKeyRef:
              name: palworld-settings
              key: death_penalty
        - name: DROP_ITEM_ALIVE_MAX_HOURS
          valueFrom:
            configMapKeyRef:
              name: palworld-settings
              key: drop_items_timeout_hours
        # - name: PAL_EGG_DEFAULT_HATCHING_TIME
        #   valueFrom:
        #     configMapKeyRef:
        #       name: palworld-settings
        #       key: pal_egg_default_hatching_time
        - name: ALLOW_GLOBAL_PALBOX_EXPORT
          value: 'True'
        - name: ALLOW_GLOBAL_PALBOX_IMPORT
          value: 'True'
        resources:
          requests:
            cpu: 4000m
            memory: 12Gi
        volumeMounts:
        - mountPath: /palworld
          name: data
        # lifecycle:
        #   preStop:
        #     exec:
        #       command:
        #       - /bin/sh
        #       - -c
        #       - |
        #         rcon-cli save
        #         backup
        # volumes:
        # - name: data
        #   persistentVolumeClaim:
        #     claimName: data
        readinessProbe:
          exec:
            command: ["sh", "-c", "pgrep PalServer-Linux >/dev/null"]
          periodSeconds: 10
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
